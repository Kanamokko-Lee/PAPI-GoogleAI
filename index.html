<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>PAPI Glide Path Simulator v1.1</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&display=swap');
    * { box-sizing: border-box; }
    body { font-family: 'JetBrains Mono', monospace; background: #0f172a; color: #e2e8f0; margin: 0; }
    input[type=range] { -webkit-appearance: none; appearance: none; height: 6px; border-radius: 4px; background: #1e293b; outline: none; cursor: pointer; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #6366f1; cursor: pointer; border: 2px solid #fff; }
    .papi-light-white { background: radial-gradient(circle at 40% 35%, #fff 10%, #f1f5f9 50%, #fef9c3 100%); box-shadow: 0 0 18px 4px rgba(255,255,255,0.85); }
    .papi-light-red   { background: radial-gradient(circle at 40% 35%, #fca5a5 10%, #ef4444 50%, #991b1b 100%); box-shadow: 0 0 16px 4px rgba(239,68,68,0.80); }
    .btn-active-indigo { background: #4f46e5; color: #fff; }
    .btn-active-indigo-outline { background: rgba(99,102,241,0.15); color: #a5b4fc; border: 1px solid rgba(99,102,241,0.35); }
    .btn-inactive { color: #64748b; border: 1px solid transparent; }
    .btn-inactive:hover { color: #cbd5e1; background: rgba(255,255,255,0.05); }
    svg text { font-family: 'JetBrains Mono', monospace; pointer-events: none; }
    .animate-pulse-subtle { animation: pulse 3s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
  </style>
</head>
<body class="min-h-screen flex flex-col">

<!-- HEADER (Original Style) -->
<header class="border-b border-slate-800 bg-slate-950 sticky top-0 z-50 px-4 py-3 flex justify-between items-center">
  <div class="flex items-center gap-3">
    <div class="bg-indigo-600 p-2 rounded-lg text-white">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="m16 12-4-4-4 4M12 8v8"/></svg>
    </div>
    <div>
      <h1 class="text-sm font-bold text-white tracking-tight">PAPI Glide Path Temperature Simulator</h1>
      <p class="text-[10px] text-slate-400">高度偏差 & 進入角可視化ツール</p>
    </div>
  </div>
  <div class="flex items-center gap-2 font-mono">
    <span id="temp-dev-badge" class="px-2 py-1 rounded text-[10px] font-bold border border-emerald-800/50 bg-emerald-950/30 text-emerald-400">Δ+0.0°C</span>
  </div>
</header>

<main class="flex-1 grid grid-cols-1 xl:grid-cols-12 gap-4 p-4">

  <!-- LEFT: SVG (The core visual) -->
  <div class="xl:col-span-8 flex flex-col gap-3">
    <div class="bg-slate-950 border border-slate-800 rounded-2xl p-4 shadow-2xl flex flex-col">
      <div class="flex justify-between items-center mb-3 pb-3 border-b border-slate-800/60">
        <h2 class="text-xs font-bold text-slate-300 uppercase tracking-widest">Vertical Approach Profile</h2>
        <div class="flex gap-4 text-[9px] font-bold">
          <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-400"></span> 3.02° Path</span>
          <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-indigo-500"></span> 3.25° Path</span>
        </div>
      </div>

      <div class="relative w-full overflow-hidden rounded-xl bg-slate-900/20 border border-slate-900">
        <svg id="main-svg" viewBox="0 0 820 420" class="w-full h-auto select-none"></svg>
      </div>

      <!-- Controls (Original Style) -->
      <div class="mt-4 grid grid-cols-1 md:grid-cols-3 gap-4">
        <!-- Temp -->
        <div class="md:col-span-1 bg-slate-900/60 p-3 rounded-xl border border-slate-800">
          <div class="flex justify-between items-center mb-2">
            <span class="text-[10px] text-slate-400 font-bold">AIRPORT TEMP</span>
            <button onclick="resetTemp()" class="text-[9px] bg-slate-800 hover:bg-slate-700 px-2 py-0.5 rounded text-slate-300 border border-slate-700">RESET (15°C)</button>
          </div>
          <div class="flex items-center gap-3">
            <input type="range" id="temp-slider" min="-15" max="45" step="1" value="15" class="flex-1" />
            <span id="temp-display" class="font-mono text-xs font-bold text-emerald-400 w-10 text-right">15°C</span>
          </div>
        </div>
        <!-- PAPI Setup -->
        <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-800 flex flex-col gap-2">
          <label class="text-[10px] text-slate-400 font-bold">PAPI SPECIFICATION</label>
          <div class="grid grid-cols-2 gap-1 bg-slate-950 p-1 rounded-lg border border-slate-800">
            <button id="btn-general" onclick="setPapiMode('general')" class="py-1 rounded text-[10px] font-bold transition-all btn-active-indigo">Std 3.00°</button>
            <button id="btn-hnd" onclick="setPapiMode('hnd')" class="py-1 rounded text-[10px] font-bold transition-all btn-inactive">HND 3.25°</button>
          </div>
        </div>
        <!-- Zoom/ILS -->
        <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-800 flex flex-col gap-2">
          <label class="text-[10px] text-slate-400 font-bold">VERT EXAGGERATION (ZOOM)</label>
          <div class="flex items-center gap-3 mt-1">
            <input type="range" id="zoom-slider" min="5" max="25" step="1" value="12" class="flex-1" />
            <span id="zoom-display" class="font-mono text-xs font-bold text-slate-300">12x</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- RIGHT: Cockpit & Data -->
  <div class="xl:col-span-4 flex flex-col gap-4">
    
    <!-- PAPI Display (Original Widget) -->
    <div class="bg-slate-950 border border-slate-800 rounded-2xl p-4 shadow-xl">
      <div class="flex justify-between items-center border-b border-slate-800 pb-2 mb-4">
        <h3 class="text-xs font-bold text-slate-200">PAPI COCKPIT VIEW</h3>
        <div class="flex gap-1">
          <button id="mon-302" onclick="setMonitorGp(3.02)" class="text-[9px] px-2 py-1 rounded bg-slate-900 border border-slate-700 text-slate-500 font-bold">3.02°</button>
          <button id="mon-325" onclick="setMonitorGp(3.25)" class="text-[9px] px-2 py-1 rounded bg-indigo-900/40 border border-indigo-500 text-indigo-300 font-bold">3.25°</button>
        </div>
      </div>

      <div class="bg-slate-900/80 rounded-xl p-4 flex flex-col items-center gap-4">
        <div class="text-center">
          <span class="text-[9px] text-slate-500 font-bold uppercase tracking-widest">Effective Angle</span>
          <div class="text-2xl font-mono font-black text-white" id="true-angle-display">3.25°</div>
        </div>
        <div class="flex gap-2" id="papi-lights-container"></div>
        <div id="papi-label" class="w-full text-center text-[10px] font-bold py-2 rounded-lg border">---</div>
      </div>
    </div>

    <!-- Altitude Statistics -->
    <div class="bg-slate-950 border border-slate-800 rounded-2xl p-4 shadow-xl flex-1">
      <h3 class="text-xs font-bold text-slate-200 mb-4 border-b border-slate-800 pb-2 flex items-center gap-2">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10M18 20V4M6 20v-4"/></svg>
        ALTITUDE AT 3.0 NM
      </h3>
      
      <div class="space-y-3">
        <div class="p-3 bg-slate-900/40 rounded-xl border border-slate-800">
          <div class="flex justify-between items-center text-[10px] font-bold mb-2">
            <span class="text-emerald-400">STANDARD (3.02°)</span>
            <span id="diff-302" class="font-mono text-slate-400">±0 ft</span>
          </div>
          <div class="flex justify-between items-end">
            <span class="text-[9px] text-slate-500 uppercase">Actual Alt</span>
            <span id="true-302" class="text-xl font-mono font-bold text-white">960 ft</span>
          </div>
        </div>

        <div class="p-3 bg-slate-900/40 rounded-xl border border-slate-800">
          <div class="flex justify-between items-center text-[10px] font-bold mb-2">
            <span class="text-indigo-400">STEEP (3.25°)</span>
            <span id="diff-325" class="font-mono text-slate-400">±0 ft</span>
          </div>
          <div class="flex justify-between items-end">
            <span class="text-[9px] text-slate-500 uppercase">Actual Alt</span>
            <span id="true-325" class="text-xl font-mono font-bold text-white">1035 ft</span>
          </div>
        </div>
      </div>

      <div id="safety-alert" class="mt-4 p-3 rounded-lg text-[10px] leading-relaxed border transition-colors duration-300">
        <!-- Warning text generated by JS -->
      </div>
    </div>
  </div>
</main>

<script>
const state = {
  papiMode: 'general',
  temp: 15,
  zoom: 12,
  monitorGp: 3.25,
};

const ISA_TEMP = 15;
const ABS_ZERO = -273.15;
const FT_PER_NM = 6076.12;

const PAPI_BOUNDS = {
  general: [3.58, 3.25, 2.75, 2.42], // With ILS style
  hnd:     [3.83, 3.50, 3.00, 2.67]
};

function calcTrueAngle(nominal, temp) {
  return nominal * ((temp - ABS_ZERO) / (ISA_TEMP - ABS_ZERO));
}

function updateAll() {
  const t = state.temp;
  const true302 = calcTrueAngle(3.02, t);
  const true325 = calcTrueAngle(3.25, t);
  const curTrue = state.monitorGp === 3.02 ? true302 : true325;
  const dev = t - ISA_TEMP;

  // Header & Slider
  document.getElementById('temp-display').textContent = `${t}°C`;
  document.getElementById('temp-dev-badge').textContent = `Δ${dev>=0?'+':''}${dev.toFixed(1)}°C`;
  document.getElementById('temp-dev-badge').className = `px-2 py-1 rounded text-[10px] font-bold border ${t==15?'border-emerald-800/50 bg-emerald-950/30 text-emerald-400':t<15?'border-sky-800/50 bg-sky-950/30 text-sky-400':'border-orange-800/50 bg-orange-950/30 text-orange-400'}`;
  document.getElementById('zoom-display').textContent = `${state.zoom}x`;

  // Cockpit
  document.getElementById('true-angle-display').textContent = `${curTrue.toFixed(2)}°`;
  const bounds = PAPI_BOUNDS[state.papiMode];
  renderPapi(curTrue, bounds);

  // Stats
  const h302 = Math.round(3 * FT_PER_NM * Math.tan(true302 * Math.PI / 180));
  const h325 = Math.round(3 * FT_PER_NM * Math.tan(true325 * Math.PI / 180));
  const nom302 = Math.round(3 * FT_PER_NM * Math.tan(3.02 * Math.PI / 180));
  const nom325 = Math.round(3 * FT_PER_NM * Math.tan(3.25 * Math.PI / 180));
  
  updateStat('true-302', 'diff-302', h302, h302 - nom302);
  updateStat('true-325', 'diff-325', h325, h325 - nom325);

  const alertBox = document.getElementById('safety-alert');
  const diff325 = h325 - nom325;
  if (t < 15) {
    alertBox.className = "mt-4 p-3 rounded-lg text-[10px] leading-relaxed border bg-rose-950/20 border-rose-800/50 text-rose-300";
    alertBox.innerHTML = `<strong>CAUTION:</strong> 低温により実高度が計器高度より <strong>${Math.abs(diff325)}ft 低くなっています</strong>。PAPIは「低め」を表示しますが、これが正常です。`;
  } else if (t > 15) {
    alertBox.className = "mt-4 p-3 rounded-lg text-[10px] leading-relaxed border bg-orange-950/20 border-orange-800/50 text-orange-300";
    alertBox.innerHTML = `<strong>NOTE:</strong> 高温により実進入角が深くなっています (${true325.toFixed(2)}°)。オーバーシュートに注意してください。`;
  } else {
    alertBox.className = "mt-4 p-3 rounded-lg text-[10px] leading-relaxed border bg-slate-900 border-slate-800 text-slate-500";
    alertBox.innerHTML = `ISA (15°C) 環境下です。高度偏差は発生していません。`;
  }

  drawSVG(true302, true325, bounds);
}

function updateStat(idVal, idDiff, val, diff) {
  document.getElementById(idVal).textContent = `${val} ft`;
  const diffEl = document.getElementById(idDiff);
  diffEl.textContent = `${diff >= 0 ? '+' : ''}${diff} ft`;
  diffEl.className = `font-mono font-bold ${diff < 0 ? 'text-rose-400' : diff > 0 ? 'text-emerald-400' : 'text-slate-500'}`;
}

function renderPapi(angle, bounds) {
  const container = document.getElementById('papi-lights-container');
  container.innerHTML = '';
  const colors = bounds.map(b => angle >= b ? 'W' : 'R');
  colors.forEach(c => {
    const div = document.createElement('div');
    div.className = `w-12 h-12 rounded-xl border-2 border-slate-800 ${c === 'W' ? 'papi-light-white' : 'papi-light-red'}`;
    container.appendChild(div);
  });

  const redCount = colors.filter(c => c === 'R').length;
  const label = document.getElementById('papi-label');
  const info = [
    { txt: 'TOO HIGH (4W)', cls: 'border-emerald-500/50 text-emerald-400 bg-emerald-500/10' },
    { txt: 'SLIGHTLY HIGH (3W1R)', cls: 'border-lime-500/50 text-lime-400 bg-lime-500/10' },
    { txt: 'ON GLIDE PATH (2W2R)', cls: 'border-cyan-500/50 text-cyan-400 bg-cyan-500/10' },
    { txt: 'SLIGHTLY LOW (1W3R)', cls: 'border-orange-500/50 text-orange-400 bg-orange-500/10' },
    { txt: 'TOO LOW (4R)', cls: 'border-rose-500/50 text-rose-400 bg-rose-500/10 animate-pulse' }
  ][redCount];
  label.textContent = info.txt;
  label.className = `w-full text-center text-[10px] font-bold py-2 rounded-lg border ${info.cls}`;
}

function drawSVG(t302, t325, bounds) {
  const svg = document.getElementById('main-svg');
  svg.innerHTML = '';
  const OX = 60, OY = 360, W = 820, H = 420;
  const ns = "http://www.w3.org/2000/svg";

  const getAng = (a) => (a - 2.0) * state.zoom + 20; // Visual mapping
  const getCoords = (a, nm) => {
    const rad = getAng(a) * Math.PI / 180;
    return { x: OX + nm * 200, y: OY - Math.tan(rad) * (nm * 200) };
  };

  // Ground
  const ground = document.createElementNS(ns, "rect");
  ground.setAttribute("x", 0); ground.setAttribute("y", OY); ground.setAttribute("width", W); ground.setAttribute("height", H-OY);
  ground.setAttribute("fill", "#070d19");
  svg.appendChild(ground);

  // NM Grid
  for(let i=1; i<=3; i++) {
    const x = OX + i * 200;
    const l = document.createElementNS(ns, "line");
    l.setAttribute("x1", x); l.setAttribute("y1", 30); l.setAttribute("x2", x); l.setAttribute("y2", OY);
    l.setAttribute("stroke", "#1e293b"); l.setAttribute("stroke-dasharray", "4,4");
    svg.appendChild(l);
    const t = document.createElementNS(ns, "text");
    t.setAttribute("x", x); t.setAttribute("y", OY+15); t.setAttribute("fill", "#475569"); t.setAttribute("font-size", "10"); t.setAttribute("text-anchor", "middle");
    t.textContent = `${i}NM`;
    svg.appendChild(t);
  }

  // Paths
  const drawPath = (a, col, name, isThick) => {
    const p = getCoords(a, 3.5);
    const l = document.createElementNS(ns, "line");
    l.setAttribute("x1", OX); l.setAttribute("y1", OY); l.setAttribute("x2", p.x); l.setAttribute("y2", p.y);
    l.setAttribute("stroke", col); l.setAttribute("stroke-width", isThick ? 3 : 1);
    if(!isThick) l.setAttribute("stroke-dasharray", "4,2");
    svg.appendChild(l);
    
    if(isThick) {
      const label = document.createElementNS(ns, "text");
      const lp = getCoords(a, 3.1);
      label.setAttribute("x", lp.x); label.setAttribute("y", lp.y - 10); label.setAttribute("fill", col); label.setAttribute("font-size", "9"); label.setAttribute("font-weight", "bold");
      label.textContent = `${name}: ${a.toFixed(2)}°`;
      svg.appendChild(label);
    }
  };

  // PAPI Boundaries (Dashed)
  bounds.forEach(b => drawPath(b, "#334155", "", false));
  
  // Active Paths
  drawPath(t302, "#10b981", "3.02 GP", true);
  drawPath(t325, "#6366f1", "3.25 GP", true);
}

// Controls
function setPapiMode(m) {
  state.papiMode = m;
  document.getElementById('btn-general').className = `py-1 rounded text-[10px] font-bold transition-all ${m==='general'?'btn-active-indigo':'btn-inactive'}`;
  document.getElementById('btn-hnd').className = `py-1 rounded text-[10px] font-bold transition-all ${m==='hnd'?'btn-active-indigo':'btn-inactive'}`;
  updateAll();
}
function setMonitorGp(g) {
  state.monitorGp = g;
  document.getElementById('mon-302').className = `text-[9px] px-2 py-1 rounded font-bold border ${g===3.02?'bg-emerald-900/40 border-emerald-500 text-emerald-300':'bg-slate-900 border-slate-700 text-slate-500'}`;
  document.getElementById('mon-325').className = `text-[9px] px-2 py-1 rounded font-bold border ${g===3.25?'bg-indigo-900/40 border-indigo-500 text-indigo-300':'bg-slate-900 border-slate-700 text-slate-500'}`;
  updateAll();
}
function resetTemp() {
  state.temp = 15;
  document.getElementById('temp-slider').value = 15;
  updateAll();
}

document.getElementById('temp-slider').oninput = (e) => { state.temp = parseInt(e.target.value); updateAll(); };
document.getElementById('zoom-slider').oninput = (e) => { state.zoom = parseInt(e.target.value); updateAll(); };

updateAll();
</script>
</body>
</html>
