<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>PAPI Glide Path Simulator v1.5</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&display=swap');
    * { box-sizing: border-box; }
    body { font-family: 'JetBrains Mono', monospace; background: #0f172a; color: #e2e8f0; margin: 0; }
    
    /* スライダーのスタイル */
    input[type=range] { -webkit-appearance: none; appearance: none; height: 8px; border-radius: 4px; background: #1e293b; outline: none; cursor: pointer; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #6366f1; cursor: pointer; border: 2px solid #fff; }
    
    /* PAPI丸型ライト */
    .papi-light-white { background: radial-gradient(circle at 40% 35%, #fff 10%, #f1f5f9 50%, #fef9c3 100%); box-shadow: 0 0 25px 8px rgba(255,255,255,0.8); border: 3px solid #475569; }
    .papi-light-red   { background: radial-gradient(circle at 40% 35%, #fca5a5 10%, #ef4444 50%, #991b1b 100%); box-shadow: 0 0 20px 8px rgba(239,68,68,0.7); border: 3px solid #7f1d1d; }
    
    .btn-active-indigo { background: #4f46e5; color: #fff; border-color: #6366f1; }
    .btn-inactive { color: #94a3b8; background: #1e293b; border: 1px solid #334155; }
    
    svg text { font-family: 'JetBrains Mono', monospace; pointer-events: none; font-weight: bold; }
    
    /* 文字サイズの全体的な底上げ */
    .text-large { font-size: 1.1rem; }
    .text-xl-bold { font-size: 1.5rem; font-weight: 800; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

<!-- HEADER -->
<header class="border-b border-slate-800 bg-slate-950 px-6 py-4 flex justify-between items-center shadow-2xl">
  <div class="flex items-center gap-4">
    <div class="bg-indigo-600 p-2 rounded text-white shadow-lg">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="m16 12-4-4-4 4M12 8v8"/></svg>
    </div>
    <h1 class="text-xl font-black tracking-tighter uppercase">PAPI Analyzer <span class="text-indigo-400">v1.5</span></h1>
  </div>
  <div id="temp-dev-badge" class="px-4 py-2 rounded-lg font-black text-sm border border-emerald-800/50 bg-emerald-950/30 text-emerald-400">Δ+0.0°C (ISA)</div>
</header>

<main class="flex-1 grid grid-cols-1 xl:grid-cols-12 gap-6 p-6">

  <!-- LEFT & CENTER: GRAPH AREA -->
  <div class="xl:col-span-9 flex flex-col gap-6">
    <div class="flex-1 bg-slate-950 border border-slate-800 rounded-3xl p-6 shadow-2xl relative">
      
      <!-- PAPI Cockpit View (グラフ内に移動) -->
      <div class="absolute top-10 right-10 z-10 bg-slate-900/90 border-2 border-indigo-500/50 rounded-2xl p-6 shadow-2xl backdrop-blur-md flex flex-col items-center gap-4">
        <div class="text-[10px] font-black text-indigo-300 uppercase tracking-widest">PAPI Cockpit View</div>
        <div class="flex gap-4" id="papi-lights-container"></div>
        <div id="papi-label" class="text-sm font-black px-4 py-1.5 rounded-full border bg-slate-950">---</div>
      </div>

      <div class="flex justify-between items-center mb-4">
        <h2 class="text-sm font-black text-slate-500 uppercase tracking-[0.3em]">Vertical Profile (3.0 NM Range)</h2>
      </div>

      <div class="bg-slate-900/40 rounded-2xl border border-slate-800 overflow-hidden">
        <svg id="main-svg" viewBox="0 0 800 450" class="w-full h-auto select-none"></svg>
      </div>
    </div>

    <!-- Bottom Stats Area -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="bg-slate-900/50 border border-slate-800 rounded-2xl p-6">
        <h3 class="text-sm font-black text-emerald-400 mb-4 uppercase tracking-widest">3.02° Path Analysis</h3>
        <div class="flex justify-between items-end">
          <div>
            <div class="text-slate-500 text-xs font-bold uppercase">Target Alt</div>
            <div id="true-302" class="text-3xl font-black text-white">---</div>
          </div>
          <div id="diff-302" class="text-xl font-bold">±0 ft</div>
        </div>
      </div>
      <div class="bg-slate-900/50 border border-slate-800 rounded-2xl p-6">
        <h3 class="text-sm font-black text-indigo-400 mb-4 uppercase tracking-widest">3.25° Path Analysis</h3>
        <div class="flex justify-between items-end">
          <div>
            <div class="text-slate-500 text-xs font-bold uppercase">Target Alt</div>
            <div id="true-325" class="text-3xl font-black text-white">---</div>
          </div>
          <div id="diff-325" class="text-xl font-bold">±0 ft</div>
        </div>
      </div>
    </div>
  </div>

  <!-- RIGHT: CONTROL PANEL -->
  <div class="xl:col-span-3 flex flex-col gap-6">
    <div class="bg-slate-900/80 border border-slate-800 rounded-3xl p-6 flex flex-col gap-8 shadow-xl">
      <h3 class="text-lg font-black text-white border-b border-slate-700 pb-4 uppercase tracking-tighter">Flight Controls</h3>
      
      <!-- Aircraft Height Slider -->
      <div class="space-y-4">
        <div class="flex justify-between items-center">
          <label class="text-sm font-black text-orange-400 uppercase">Aircraft Alt (ft)</label>
          <span id="ac-height-display" class="font-mono text-xl font-black text-white">1000</span>
        </div>
        <input type="range" id="ac-height-slider" min="500" max="1500" step="5" value="1035" class="w-full" />
        <p class="text-[10px] text-slate-500 italic">※3NM地点での機体高度をマニュアル設定</p>
      </div>

      <!-- Eye Height Slider -->
      <div class="space-y-4">
        <div class="flex justify-between items-center">
          <label class="text-sm font-black text-indigo-300 uppercase">Eye Height (ft)</label>
          <span id="eye-height-display" class="font-mono text-xl font-black text-white">15</span>
        </div>
        <input type="range" id="eye-height-slider" min="0" max="40" step="1" value="15" class="w-full" />
      </div>

      <!-- Temperature Slider -->
      <div class="space-y-4">
        <div class="flex justify-between items-center">
          <label class="text-sm font-black text-emerald-400 uppercase">Airport Temp</label>
          <span id="temp-display" class="font-mono text-xl font-black text-white">15°C</span>
        </div>
        <input type="range" id="temp-slider" min="-20" max="45" step="1" value="15" class="w-full" />
        <button onclick="resetTemp()" class="w-full py-3 text-xs bg-slate-800 hover:bg-slate-700 rounded-xl text-slate-300 border border-slate-600 font-black transition uppercase">Reset to ISA</button>
      </div>

      <!-- PAPI Mode Switch -->
      <div class="space-y-3">
        <label class="text-sm font-black text-slate-400 uppercase">PAPI Specification</label>
        <div class="flex flex-col gap-2">
          <button id="btn-general" onclick="setPapiMode('general')" class="w-full py-3 rounded-xl text-xs font-black border transition btn-active-indigo">STD 3.00°</button>
          <button id="btn-hnd" onclick="setPapiMode('hnd')" class="w-full py-3 rounded-xl text-xs font-black border transition btn-inactive">HND 3.25°</button>
        </div>
      </div>

      <!-- Vertical Zoom -->
      <div class="space-y-3">
        <div class="flex justify-between">
          <label class="text-sm font-black text-slate-500 uppercase">Vert Zoom</label>
          <span id="zoom-display" class="font-mono text-sm font-bold text-slate-500">12x</span>
        </div>
        <input type="range" id="zoom-slider" min="5" max="25" step="1" value="12" class="w-full" />
      </div>
    </div>
  </div>
</main>

<script>
const state = { papiMode: 'general', temp: 15, zoom: 12, acHeight: 1035, eyeHeight: 15 };
const ISA_TEMP = 15;
const ABS_ZERO = -273.15;
const FT_PER_NM = 6076.12;
const DIST_NM = 3.0;
const DIST_FT = DIST_NM * FT_PER_NM;

const PAPI_BOUNDS = {
  general: [3.58, 3.25, 2.75, 2.42], 
  hnd:     [3.83, 3.50, 3.00, 2.67]
};

function calcTrueAngle(nominal, temp) {
  return nominal * ((temp - ABS_ZERO) / (ISA_TEMP - ABS_ZERO));
}

function updateAll() {
  const t = state.temp;
  const eh = state.eyeHeight;
  const ach = state.acHeight;
  
  // 3NM地点でのターゲット高度
  const true302 = calcTrueAngle(3.02, t);
  const true325 = calcTrueAngle(3.25, t);
  const target302 = DIST_FT * Math.tan(true302 * Math.PI / 180);
  const target325 = DIST_FT * Math.tan(true325 * Math.PI / 180);

  // パイロットの視点角度の計算
  const perceivedAngle = Math.atan((ach + eh) / DIST_FT) * 180 / Math.PI;

  // UI更新
  document.getElementById('temp-display').textContent = `${t}°C`;
  document.getElementById('eye-height-display').textContent = `${eh} ft`;
  document.getElementById('ac-height-display').textContent = `${ach} ft`;
  document.getElementById('temp-dev-badge').textContent = `Δ${(t-ISA_TEMP)>=0?'+':''}${(t-ISA_TEMP).toFixed(1)}°C ${t==15?'(ISA)':''}`;
  document.getElementById('zoom-display').textContent = `${state.zoom}x`;

  const bounds = PAPI_BOUNDS[state.papiMode];
  renderPapi(perceivedAngle, bounds);

  // 統計表示
  updateStat('true-302', 'diff-302', Math.round(target302), Math.round(ach - target302));
  updateStat('true-325', 'diff-325', Math.round(target325), Math.round(ach - target325));

  drawSVG(true302, true325, bounds, ach, eh);
}

function updateStat(idVal, idDiff, target, diff) {
  document.getElementById(idVal).textContent = `${target} ft`;
  const diffEl = document.getElementById(idDiff);
  diffEl.textContent = `${diff >= 0 ? '+' : ''}${diff} ft`;
  diffEl.className = `text-xl font-black font-mono ${diff < -50 ? 'text-rose-500' : diff > 50 ? 'text-emerald-500' : 'text-slate-400'}`;
}

function renderPapi(angle, bounds) {
  const container = document.getElementById('papi-lights-container');
  container.innerHTML = '';
  const colors = bounds.map(b => angle >= b ? 'W' : 'R');
  colors.forEach(c => {
    const div = document.createElement('div');
    div.className = `w-14 h-14 rounded-full ${c === 'W' ? 'papi-light-white' : 'papi-light-red'}`;
    container.appendChild(div);
  });
  const redCount = colors.filter(c => c === 'R').length;
  const label = document.getElementById('papi-label');
  const info = [
    { txt: 'TOO HIGH', cls: 'border-emerald-500 text-emerald-400' },
    { txt: 'SLIGHTLY HIGH', cls: 'border-lime-500 text-lime-400' },
    { txt: 'ON GLIDE PATH', cls: 'border-cyan-500 text-cyan-400' },
    { txt: 'SLIGHTLY LOW', cls: 'border-orange-500 text-orange-400' },
    { txt: 'TOO LOW', cls: 'border-rose-500 text-rose-400' }
  ][redCount];
  label.textContent = info.txt;
  label.className = `text-sm font-black px-6 py-1.5 rounded-full border bg-slate-950 shadow-lg ${info.cls}`;
}

function drawSVG(t302, t325, bounds, ach, eh) {
  const svg = document.getElementById('main-svg');
  svg.innerHTML = '';
  const OX = 80, OY = 380, W = 800, H = 450;
  const ns = "http://www.w3.org/2000/svg";

  const getAng = (a) => (a - 2.0) * state.zoom + 20;
  const getCoords = (a, nm, offsetFt = 0) => {
    const distPx = nm * 200;
    const rad = getAng(a) * Math.PI / 180;
    // 垂直誇張を考慮したオフセット描画
    const visualOffset = (offsetFt / 100) * state.zoom; 
    return { x: OX + distPx, y: OY - Math.tan(rad) * distPx - visualOffset };
  };

  // 適正経路エリア
  const p1 = getCoords(bounds[1], 4);
  const p2 = getCoords(bounds[2], 4);
  const area = document.createElementNS(ns, "polygon");
  area.setAttribute("points", `${OX},${OY} ${p1.x},${p1.y} ${p2.x},${p2.y}`);
  area.setAttribute("fill", "rgba(16, 185, 129, 0.1)");
  svg.appendChild(area);

  // 地面
  const ground = document.createElementNS(ns, "rect");
  ground.setAttribute("x", 0); ground.setAttribute("y", OY); ground.setAttribute("width", W); ground.setAttribute("height", H-OY);
  ground.setAttribute("fill", "#070d19");
  svg.appendChild(ground);

  // PAPIユニット
  const unit = document.createElementNS(ns, "rect");
  unit.setAttribute("x", OX-8); unit.setAttribute("y", OY-8); unit.setAttribute("width", 16); unit.setAttribute("height", 8);
  unit.setAttribute("fill", "#f1f5f9");
  svg.appendChild(unit);

  // グリッド
  for(let i=1; i<=3; i++) {
    const x = OX + i * 200;
    const l = document.createElementNS(ns, "line");
    l.setAttribute("x1", x); l.setAttribute("y1", 20); l.setAttribute("x2", x); l.setAttribute("y2", OY);
    l.setAttribute("stroke", "#1e293b"); l.setAttribute("stroke-dasharray", "4,4");
    svg.appendChild(l);
    const t = document.createElementNS(ns, "text");
    t.setAttribute("x", x); t.setAttribute("y", OY+25); t.setAttribute("fill", "#475569"); t.setAttribute("font-size", "12"); t.setAttribute("text-anchor", "middle");
    t.textContent = `${i}NM`;
    svg.appendChild(t);
  }

  // ターゲットパス描画
  const drawPath = (a, col, isThick) => {
    const p = getCoords(a, 3.5);
    const l = document.createElementNS(ns, "line");
    l.setAttribute("x1", OX); l.setAttribute("y1", OY); l.setAttribute("x2", p.x); l.setAttribute("y2", p.y);
    l.setAttribute("stroke", col); l.setAttribute("stroke-width", isThick ? 3 : 1);
    if(!isThick) l.setAttribute("stroke-dasharray", "5,3");
    svg.appendChild(l);
  };

  bounds.forEach(b => drawPath(b, "#334155", false));
  drawPath(t302, "#10b981", true);
  drawPath(t325, "#6366f1", true);

  // 航空機（マニュアル高度）の描画
  // 3NM地点での見かけの角度を逆算して座標を得る
  const acAngle = Math.atan(ach / DIST_FT) * 180 / Math.PI;
  const acPos = getCoords(acAngle, 3);
  const eyePos = getCoords(acAngle, 3, eh);

  // 機体本体
  const ac = document.createElementNS(ns, "circle");
  ac.setAttribute("cx", acPos.x); ac.setAttribute("cy", acPos.y); ac.setAttribute("r", 6);
  ac.setAttribute("fill", "#fb923c");
  ac.setAttribute("stroke", "#fff");
  ac.setAttribute("stroke-width", "2");
  svg.appendChild(ac);

  // 視点
  if(eh > 0) {
    const eye = document.createElementNS(ns, "circle");
    eye.setAttribute("cx", eyePos.x); eye.setAttribute("cy", eyePos.y); eye.setAttribute("r", 4);
    eye.setAttribute("fill", "#fff");
    svg.appendChild(eye);
    const line = document.createElementNS(ns, "line");
    line.setAttribute("x1", acPos.x); line.setAttribute("y1", acPos.y); line.setAttribute("x2", eyePos.x); line.setAttribute("y2", eyePos.y);
    line.setAttribute("stroke", "#fff"); line.setAttribute("stroke-width", "1.5"); line.setAttribute("stroke-dasharray", "2,2");
    svg.appendChild(line);
  }
}

function setPapiMode(m) {
  state.papiMode = m;
  document.getElementById('btn-general').className = `w-full py-3 rounded-xl text-xs font-black border transition ${m==='general'?'btn-active-indigo':'btn-inactive'}`;
  document.getElementById('btn-hnd').className = `w-full py-3 rounded-xl text-xs font-black border transition ${m==='hnd'?'btn-active-indigo':'btn-inactive'}`;
  updateAll();
}
function resetTemp() {
  state.temp = 15;
  document.getElementById('temp-slider').value = 15;
  updateAll();
}

document.getElementById('temp-slider').oninput = (e) => { state.temp = parseInt(e.target.value); updateAll(); };
document.getElementById('ac-height-slider').oninput = (e) => { state.acHeight = parseInt(e.target.value); updateAll(); };
document.getElementById('eye-height-slider').oninput = (e) => { state.eyeHeight = parseInt(e.target.value); updateAll(); };
document.getElementById('zoom-slider').oninput = (e) => { state.zoom = parseInt(e.target.value); updateAll(); };

updateAll();
</script>
</body>
</html>
